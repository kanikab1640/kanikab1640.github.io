name: Deploy to Pages
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.pages-deploy.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Process
        env:
          A12529: ${{ secrets.A12529 }}
          B401DC: ${{ secrets.B401DC }}
        run: |
          python3 -c "
          import pathlib, os, sys
          sec_a = os.environ.get('A12529', '')
          sec_b = os.environ.get('B401DC', '')
          target = pathlib.Path('index.html')
          before = target.read_text(encoding='utf-8')
          after = before
          if sec_a:
              after = after.replace('<!-- 01ae20ceb0f737ecf3a9cc484b61eacd330cbd6e -->', sec_a)
          if sec_b:
              after = after.replace('<!-- 2e29b33c9ef750c51ad637b951 -->', sec_b)
          if after == before and (sec_a or sec_b):
              sys.exit(1)
          if after != before:
              target.write_text(after, encoding='utf-8')
          "
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: pages-deploy
        uses: actions/deploy-pages@v4
